<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anime x 語音日記</title>
  <style>
    /* ====== 全局變數：原神鎏金星空 + 鳴潮黑金輕科幻青 ====== */
    :root {
      --bg-deep: #0b0e17;
      --panel-bg: rgba(16, 22, 36, 0.78);
      --gold-accent: #e3c178;      /* 原神風鎏金 */
      --cyan-glow: #3bf0e4;        /* 鳴潮風共鳴青 */
      --pink-cute: #ff85b3;        /* 妹子模式主題色 */
      --theme-active: var(--pink-cute);
      --text-main: #f0f4ff;
      --text-sub: #9aa7c2;
    }

    /* 切換到專家模式時的全局主題色變化 */
    body.expert-theme {
      --theme-active: var(--cyan-glow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      background: radial-gradient(circle at 50% 15%, #1c2541 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      overflow: hidden;
      overscroll-behavior: none;
      position: relative;
    }

    /* 背景科技網格與星塵裝飾 */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(227, 193, 120, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(227, 193, 120, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-particles {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--gold-accent) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    /* 主終端玻璃擬態容器 */
    .terminal-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(227, 193, 120, 0.35);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), inset 0 0 30px rgba(227, 193, 120, 0.05);
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      transition: border-color 0.4s ease;
    }

    /* 四角菱形鎏金裝飾 */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--gold-accent);
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    /* 頂部設定欄 */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      flex-shrink: 0;
      gap: 14px;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 模式切換按鈕組 */
    .mode-switcher {
      display: flex;
      background: rgba(8, 11, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 7px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn:hover {
      color: var(--text-main);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--theme-active), rgba(227, 193, 120, 0.85));
      color: #0b0e17;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
    }

    .top-actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    body.view-diary #modeSwitcher {
      display: none;
    }

    .view-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    body.view-diary #chatView,
    body.view-chat #diaryView {
      display: none;
    }

    .month-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 14px;
    }

    .month-label {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .month-nav,
    .month-today {
      background: rgba(8, 11, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }

    .month-nav {
      width: 36px;
      height: 36px;
      font-size: 20px;
      line-height: 1;
    }

    .month-today {
      padding: 8px 12px;
      font-size: 13px;
    }

    .month-nav:disabled,
    .month-today:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior: contain;
      flex-shrink: 0;
      padding: 12px 2px;
    }

    .date-strip::-webkit-scrollbar {
      height: 6px;
    }

    .date-strip::-webkit-scrollbar-thumb {
      background: rgba(227, 193, 120, 0.3);
      border-radius: 4px;
    }

    .date-btn {
      flex: 0 0 auto;
      background: rgba(8, 11, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-sub);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .date-btn.active {
      background: linear-gradient(135deg, var(--gold-accent), rgba(227, 193, 120, 0.75));
      color: #0b0e17;
      border-color: transparent;
    }

    .diary-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 16px;
      background: rgba(9, 13, 22, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .diary-body::-webkit-scrollbar {
      width: 6px;
    }

    .diary-body::-webkit-scrollbar-thumb {
      background: rgba(227, 193, 120, 0.3);
      border-radius: 4px;
    }

    .diary-empty {
      color: var(--text-sub);
    }

    .diary-body.is-editable {
      cursor: pointer;
    }

    .diary-editor {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .diary-editor[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .diary-editor-card {
      position: relative;
      z-index: 1;
      width: min(100%, 640px);
      height: min(100%, 720px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(12, 16, 28, 0.96);
      border: 1px solid rgba(227, 193, 120, 0.35);
    }

    .diary-editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .diary-editor textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      resize: none;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(8, 11, 20, 0.8);
      color: var(--text-main);
      padding: 14px;
      line-height: 1.7;
      font-size: 15px;
    }

    .diary-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
      padding-top: 16px;
    }

    .diary-btn {
      background: transparent;
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .diary-btn:hover {
      box-shadow: 0 0 18px rgba(227, 193, 120, 0.35);
    }

    .diary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .diary-status {
      min-height: 18px;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    /* 角色頭像與狀態展示區 */
    .character-stage {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 24px;
      padding: 20px 6px;
    }

    .avatar-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orbit-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px dashed var(--theme-active);
      opacity: 0.75;
      animation: spinSlow 18s linear infinite;
      transition: border-color 0.4s ease, opacity 0.4s ease;
    }

    body[data-phase="idle"] .avatar-wrapper {
      animation: avatarFloat 3.8s ease-in-out infinite;
    }

    body[data-phase="listening"] .avatar-frame {
      animation: avatarListen 1.5s ease-in-out infinite;
    }

    body[data-phase="thinking"] .orbit-ring {
      animation-duration: 4.2s;
      opacity: 1;
    }

    body[data-phase="thinking"] .avatar-frame {
      box-shadow: 0 0 18px rgba(59, 240, 228, 0.35);
    }

    body[data-phase="speaking"] .avatar-frame {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(255, 133, 179, 0.55);
    }

    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes avatarListen {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(255, 59, 92, 0.22); }
      50% { transform: scale(1.045); box-shadow: 0 0 28px rgba(255, 59, 92, 0.5); }
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .avatar-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2.5px solid var(--gold-accent);
      box-shadow: 0 0 22px rgba(227, 193, 120, 0.28);
      overflow: hidden;
      background: #141a29;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 自動完美居中裁切不變形 */
      transition: opacity 0.25s ease, transform 0.35s ease;
    }

    .avatar-frame img.switching {
      opacity: 0;
      transform: scale(0.88);
    }

    .mode-badge {
      position: absolute;
      bottom: -8px;
      background: #0b0e17;
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      font-size: 10px;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .character-info h1 {
      font-size: 22px;
      letter-spacing: 1px;
      color: var(--text-main);
      text-shadow: 0 0 12px rgba(227, 193, 120, 0.35);
    }

    .character-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 8px;
    }

    .character-heading .mode-btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4cd964;
      box-shadow: 0 0 8px #4cd964;
      transition: all 0.3s ease;
    }

    .status-dot.listening,
    .status-dot.recording {
      background: #ff3b5c;
      box-shadow: 0 0 12px #ff3b5c;
      animation: blink 0.8s infinite alternate;
    }

    .status-dot.thinking {
      background: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .status-dot.speaking {
      background: var(--pink-cute);
      box-shadow: 0 0 12px var(--pink-cute);
      animation: blink 1.1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* 對話記錄視口 */
    .chat-viewport {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      background: rgba(9, 13, 22, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .chat-viewport::-webkit-scrollbar-thumb {
      background: rgba(227, 193, 120, 0.3);
      border-radius: 4px;
    }

    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 15px;
      animation: fadeInUp 0.3s ease;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(227, 193, 120, 0.22), rgba(227, 193, 120, 0.08));
      border: 1px solid rgba(227, 193, 120, 0.4);
      color: var(--gold-accent);
      font-size: 13px;
    }

    .ai-message {
      align-self: flex-start;
      background: rgba(26, 35, 58, 0.85);
      border-left: 3px solid var(--theme-active);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .msg-sender {
      font-size: 12px;
      color: var(--theme-active);
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    /* 底部錄音控制甲板 */
    .control-deck {
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .model-tag {
      position: absolute;
      left: 0;
      bottom: 4px;
      font-size: 11px;
      color: rgba(154, 167, 194, 0.55);
      letter-spacing: 1px;
    }

    .record-btn {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid var(--gold-accent);
      background: radial-gradient(circle, #232f4d 0%, #101626 100%);
      color: var(--gold-accent);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(227, 193, 120, 0.25);
    }

    .record-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px rgba(227, 193, 120, 0.5);
    }

    .record-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .record-btn svg {
      width: 28px;
      height: 28px;
      z-index: 2;
    }

    .hidden {
      display: none !important;
    }

    body[data-phase="idle"] .record-btn {
      animation: micInvite 2.8s ease-in-out infinite;
    }

    body[data-phase="idle"] .record-btn .pulse-ring {
      border-color: var(--gold-accent);
      animation: micHalo 2.8s ease-out infinite;
    }

    body[data-phase="idle"] .record-btn .pulse-ring.delay {
      animation-delay: 1.4s;
    }

    @keyframes micInvite {
      0%, 100% { box-shadow: 0 0 16px rgba(227, 193, 120, 0.22); }
      50% { box-shadow: 0 0 30px rgba(227, 193, 120, 0.58); }
    }

    @keyframes micHalo {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* 錄音進行中的聲波擴散光效 */
    .record-btn.recording {
      border-color: #ff3b5c;
      color: #ff3b5c;
      background: radial-gradient(circle, #3d1422 0%, #16080e 100%);
    }

    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid #ff3b5c;
      opacity: 0;
      pointer-events: none;
    }

    .record-btn.recording .pulse-ring {
      animation: soundWave 1.6s ease-out infinite;
    }

    .record-btn.recording .pulse-ring.delay {
      animation-delay: 0.8s;
    }

    @keyframes soundWave {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    .record-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    .mute-btn {
      background: rgba(8, 11, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .mute-btn[aria-pressed="true"] {
      color: var(--text-sub);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .reply-stage {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
    }

    body.stage-on .reply-stage {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.45s ease, visibility 0s linear 0s;
    }

    .stage-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      background: rgba(3, 5, 12, 0.9);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .stage-close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 2;
      background: rgba(8, 11, 20, 0.8);
      border: 1px solid rgba(227, 193, 120, 0.45);
      color: var(--gold-accent);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .stage-card {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      max-height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .stage-portrait {
      width: min(58vw, 240px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2.5px solid var(--gold-accent);
      box-shadow: 0 0 36px rgba(255, 133, 179, 0.38);
      overflow: hidden;
      background: #141a29;
      transform: scale(0.88);
      opacity: 0.7;
      transition: transform 0.55s ease, opacity 0.55s ease;
      pointer-events: auto;
    }

    body.stage-on .stage-portrait {
      transform: scale(1);
      opacity: 1;
    }

    .stage-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stage-name {
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 16px rgba(255, 133, 179, 0.45);
      pointer-events: none;
    }

    body.expert-theme[data-phase="speaking"] .avatar-frame,
    body.expert-theme .stage-portrait {
      box-shadow: 0 0 32px rgba(59, 240, 228, 0.45);
    }

    body.expert-theme .stage-name {
      text-shadow: 0 0 16px rgba(59, 240, 228, 0.45);
    }

    body.expert-theme .status-dot.speaking {
      background: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .stage-reply {
      max-width: min(92vw, 34em);
      max-height: 42vh;
      overflow: auto;
      overscroll-behavior: contain;
      text-align: center;
      font-size: 22px;
      line-height: 1.65;

    // 語音日記：lite 較快；若更重品質可改回 "gemini-3.8-flash"

    const SFX_MUTE_KEY = "voice_diary_sfx_muted";
    const DIARY_PROMPT =

    // ============================================================================

    // —— 改標題與待命狀態列：編輯 name、statusTagline
    // —— 改對話區開場白：編輯 welcomeMessage
    // ============================================================================
    const MODES = {
      girl: {
        name: "星瞳",
        statusTagline: "永遠樂於傾聽你的心事",
        welcomeMessage:
          "嗨呀～✨ 點一下下面的麥克風按鈕，跟我說說話吧～我已經準備好要聽你說囉！♡(≧▽≦)♡",
        badge: "Listener",

      },

        name: "智庫終端",
        statusTagline: "全功能智慧分析機構",

          "傳輸通道就緒。請觸發下方麥克風模組建立語音輸入串流。\n\n通道開啟後，請開始發聲。我正在聆聽。",
        badge: "TACTICAL ARCHIVE",
        avatar: EXPERT_AVATAR,
        systemPrompt:
          "你是一個嚴謹、淵博、邏輯清晰的頂級領域專家。請聽取使用者的語音輸入，直接用結構清晰、專業準確的中文回答使用者的問題，不需要先輸出語音轉寫原文。嚴格限制：每次回覆請控制在1000個中文字以內。"
      }
    };

    // ============================================================================
    // 狀態與 DOM 元素綁定
    // ============================================================================
    let currentMode = "girl";
    let currentView = "chat";
    let selectedDiaryDate = "";
    let diaryMonth = "";
    let phase = "idle";
    let micRequesting = false;
    let diaryGenerating = false;
    const PHASE_NEXT = {
      idle: ["listening"],
      listening: ["thinking", "idle"],
      thinking: ["speaking", "idle"],
      speaking: ["idle"]
    };
    let mediaRecorder = null;
    let audioChunks = [];

    const modeBtns = document.querySelectorAll("#modeSwitcher .mode-btn");
    const avatarImg = document.getElementById("avatarImg");
    const modeBadge = document.getElementById("modeBadge");
    const charName = document.getElementById("charName");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const chatViewport = document.getElementById("chatViewport");
    const recordBtn = document.getElementById("recordBtn");
    const micIcon = document.getElementById("micIcon");
    const stopIcon = document.getElementById("stopIcon");
    const recordHint = document.getElementById("recordHint");
    const muteBtn = document.getElementById("muteBtn");
    const replyStage = document.getElementById("replyStage");
    const stageImg = document.getElementById("stageImg");
    const stageName = document.getElementById("stageName");
    const stageReply = document.getElementById("stageReply");
    const stageClose = document.getElementById("stageClose");
    const stageBackdrop = document.getElementById("stageBackdrop");
    let stageLine = "";

    let masterGain = null;
    let bedTimer = null;

    const welcomeMsgText = document.getElementById("welcomeMsgText");
    const welcomeSender = document.getElementById("welcomeSender");
    let openingTicket = 0;
    const viewBtns = document.querySelectorAll("#viewSwitcher .mode-btn");
    const dateStrip = document.getElementById("dateStrip");
    const diaryBody = document.getElementById("diaryBody");
    const diaryBtn = document.getElementById("diaryBtn");
    const diaryStatus = document.getElementById("diaryStatus");
    const monthLabel = document.getElementById("monthLabel");
    const monthPrev = document.getElementById("monthPrev");
    const monthNext = document.getElementById("monthNext");
    const monthToday = document.getElementById("monthToday");
    const diaryEditor = document.getElementById("diaryEditor");
    const diaryEditorInput = document.getElementById("diaryEditorInput");
    const diaryEditorDate = document.getElementById("diaryEditorDate");
    const diaryEditorClose = document.getElementById("diaryEditorClose");
    const diaryEditorBackdrop = document.getElementById("diaryEditorBackdrop");

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatClock(date) {
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function shiftDateKey(daysAgo) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() - daysAgo);
      return formatDateKey(date);
    }

    function readJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "{}");
      } catch (e) {
        return {};
      }
    }

    function writeJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getChats() {
      const data = readJson(CHAT_STORAGE_KEY);
      return data && typeof data === "object" ? data : {};
    }

    function getDiaries() {
      const data = readJson(DIARY_STORAGE_KEY);
      return data && typeof data === "object" ? data : {};
    }

    function getDayMessages(dateKey) {
      const list = getChats()[dateKey];
      return Array.isArray(list) ? list : [];
    }

    function saveChatMessage(entry) {
      const chats = getChats();
      const dateKey = entry.date;
      chats[dateKey] = Array.isArray(chats[dateKey]) ? chats[dateKey] : [];
      chats[dateKey].push(entry);
      writeJson(CHAT_STORAGE_KEY, chats);
    }

    function dateLabel(dateKey) {
      const today = shiftDateKey(0);
      const yesterday = shiftDateKey(1);
      const before = shiftDateKey(2);
      const [, month, day] = dateKey.split("-");
      const shortDate = `${Number(month)}/${Number(day)}`;
      if (dateKey === today) return `今天 ${shortDate}`;
      if (dateKey === yesterday) return `昨天 ${shortDate}`;
      if (dateKey === before) return `前天 ${shortDate}`;
      return dateKey.replace(/-/g, "/");
    }

    function currentMonthKey() {
      return shiftDateKey(0).slice(0, 7);
    }

    function shiftMonth(monthKey, delta) {
      const [year, month] = monthKey.split("-").map(Number);
      const date = new Date(year, month - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthTitle(monthKey) {
      const [year, month] = monthKey.split("-");
      return `${year}年${Number(month)}月`;
    }

    function diaryDatesInMonth(monthKey) {
      const diaries = getDiaries();
      return Object.keys(diaries)
        .filter((key) => key.startsWith(`${monthKey}-`) && String(diaries[key]?.text || "").trim())
        .sort()
        .reverse();
    }

    function clipChars(text, max) {
      const chars = Array.from(text);
      if (chars.length <= max) return text;
      return `${chars.slice(0, max).join("")}…`;
    }

    function diaryMemoryText() {
      const diaries = getDiaries();
      const today = shiftDateKey(0);
      const blocks = [];
      for (let ago = 29; ago >= 0; ago -= 1) {
        const key = shiftDateKey(ago);
        const text = String(diaries[key]?.text || "").trim();
        if (!text) continue;
        const label = key === today ? `${key}（今天已寫下的日記，可能還沒包含剛說的這句）` : key;
        blocks.push(`${label}\n${clipChars(text, 800)}`);
      }
      while (blocks.length > 1 && blocks.join("\n\n").length > 12000) blocks.shift();
      if (!blocks.length) return "";
      return `【記憶：過去30天日記，不是這次說的話】\n回答仍只針對這次語音。\n\n${blocks.join("\n\n")}`;
    }

    function requireProxyUrl() {
      return GEMINI_PROXY_URL;
    }

    function applyModeCharacterUI({ preserveStatus = false } = {}) {
      const cfg = MODES[currentMode];
      charName.textContent = cfg.name;
      modeBadge.textContent = cfg.badge;
      const busy = phase !== "idle" || micRequesting;
      if (!preserveStatus && !busy) {
        statusText.textContent = cfg.statusTagline;
      }
      refreshOpening();
    }

    function openingContext() {
      const diaries = getDiaries();
      const chats = getChats();
      const diaryBlocks = [];
      const chatBlocks = [];
      for (let ago = 29; ago >= 0; ago -= 1) {
        const key = shiftDateKey(ago);
        const diary = String(diaries[key]?.text || "").trim();
        if (diary) diaryBlocks.push(`${key}\n${clipChars(diary, 400)}`);
        const messages = Array.isArray(chats[key]) ? chats[key] : [];
        if (messages.length) {
          const lines = messages.slice(-6).map((msg) => {
            const who = msg.role === "user" ? "使用者" : (msg.sender || "星瞳");
            return `${who}：${clipChars(String(msg.text || ""), 80)}`;
          });
          chatBlocks.push(`${key}\n${lines.join("\n")}`);
        }
      }
      if (!diaryBlocks.length && !chatBlocks.length) {
        const diaryKeys = Object.keys(diaries).filter((key) => String(diaries[key]?.text || "").trim()).sort();
        const chatKeys = Object.keys(chats).filter((key) => Array.isArray(chats[key]) && chats[key].length).sort();
        const lastDiary = diaryKeys[diaryKeys.length - 1];
        const lastChat = chatKeys[chatKeys.length - 1];
        if (lastDiary) diaryBlocks.push(`${lastDiary}\n${clipChars(String(diaries[lastDiary].text).trim(), 400)}`);
        if (lastChat) {
          const lines = chats[lastChat].slice(-6).map((msg) => {
            const who = msg.role === "user" ? "使用者" : (msg.sender || "星瞳");
            return `${who}：${clipChars(String(msg.text || ""), 80)}`;
          });
          chatBlocks.push(`${lastChat}\n${lines.join("\n")}`);
        }
      }
      while (diaryBlocks.join("\n").length + chatBlocks.join("\n").length > 8000 && diaryBlocks.length + chatBlocks.length > 1) {
        if (diaryBlocks.length >= chatBlocks.length) diaryBlocks.shift();
        else chatBlocks.shift();
      }
      if (!diaryBlocks.length && !chatBlocks.length) return "";
      return `日記：\n${diaryBlocks.join("\n\n") || "（沒有）"}\n\n對話：\n${chatBlocks.join("\n\n") || "（沒有）"}`;
    }

    async function refreshOpening() {
      const ticket = ++openingTicket;
      const cfg = MODES[currentMode];
      if (welcomeSender) welcomeSender.textContent = `✦ ${cfg.name}`;
      if (welcomeMsgText) welcomeMsgText.textContent = cfg.welcomeMessage;
      if (currentMode !== "girl") return;
      const context = openingContext();
      if (!context) return;
      try {
        const line = await requestGeminiText(
          `${cfg.systemPrompt}\n現在只寫一句開場白，勾引使用者願意傾訴心事與生活。不要複述原文，不要超過20個字，不要引號，不要標題。`,
          context
        );
        if (ticket !== openingTicket || currentMode !== "girl" || !welcomeMsgText) return;
        const clean = String(line || "").replace(/^[\s"'「『]+|[\s"'」』]+$/g, "").trim();
        if (!clean) return;
        welcomeMsgText.textContent = [...clean].length > 20 ? `${[...clean].slice(0, 19).join("")}～` : clean;
      } catch (error) {
        console.error("開場白產生失敗：", error);
      }
    }

    function showView(view) {
      currentView = view === "diary" ? "diary" : "chat";
      document.body.classList.toggle("view-chat", currentView === "chat");
      document.body.classList.toggle("view-diary", currentView === "diary");
      viewBtns.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === currentView);
      });
      if (currentView === "diary") renderDiary();
    }

    function showDiaryMonth(monthKey, dateKey) {
      diaryMonth = monthKey;
      if (dateKey !== undefined) {
        selectedDiaryDate = dateKey;
      } else {
        const days = diaryDatesInMonth(monthKey);
        selectedDiaryDate = days[0] || "";
      }
      diaryStatus.textContent = "";
      renderDiary();
    }

    function renderDiary() {
      if (!diaryMonth) diaryMonth = currentMonthKey();
      monthLabel.textContent = monthTitle(diaryMonth);
      monthNext.disabled = diaryMonth >= currentMonthKey();
      const days = diaryDatesInMonth(diaryMonth);
      const inMonth = Boolean(selectedDiaryDate) && selectedDiaryDate.startsWith(`${diaryMonth}-`);
      dateStrip.innerHTML = "";
      days.forEach((dateKey) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `date-btn${dateKey === selectedDiaryDate ? " active" : ""}`;
        btn.textContent = dateLabel(dateKey);
        btn.addEventListener("click", () => {
          selectedDiaryDate = dateKey;
          diaryStatus.textContent = "";
          renderDiary();
        });
        dateStrip.appendChild(btn);
      });

      const entry = inMonth ? getDiaries()[selectedDiaryDate] : null;
      const text = String(entry?.text || "").trim();
      diaryBody.innerHTML = "";
      diaryBody.classList.toggle("is-editable", Boolean(text));
      if (text) {
        diaryBody.textContent = entry.text;
      } else {
        const empty = document.createElement("div");
        empty.className = "diary-empty";
        empty.textContent = inMonth ? "這一天還沒有日記" : "這個月還沒有日記";
        diaryBody.appendChild(empty);
      }
      diaryBtn.textContent = text ? "重新生成這一天的日記" : "生成這一天的日記";
      diaryBtn.disabled = diaryGenerating || !inMonth;
    }

    function openDiaryEditor() {
      const entry = getDiaries()[selectedDiaryDate];
      if (!entry || !String(entry.text || "").trim()) return;
      diaryEditorDate.textContent = dateLabel(selectedDiaryDate);
      diaryEditorInput.value = entry.text;
      diaryEditor.setAttribute("aria-hidden", "false");
      diaryEditorInput.focus();
    }

    function closeDiaryEditor() {
      if (diaryEditor.getAttribute("aria-hidden") !== "false") return;
      const text = diaryEditorInput.value.trim();
      const diaries = getDiaries();
      const current = String(diaries[selectedDiaryDate]?.text || "").trim();
      if (text !== current) {
        if (!text) {
          delete diaries[selectedDiaryDate];
        } else {
          const prev = diaries[selectedDiaryDate] || {};
          diaries[selectedDiaryDate] = {
            text,
            createdAt: prev.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
        }
        writeJson(DIARY_STORAGE_KEY, diaries);
      }
      diaryEditor.setAttribute("aria-hidden", "true");
      if (currentView === "diary") renderDiary();
    }

    function renderTodayChat() {
      chatViewport.querySelectorAll(".message.stored").forEach((node) => node.remove());
      getDayMessages(formatDateKey(new Date())).forEach((msg) => {
        appendMessage(msg.role === "user" ? "user" : "ai", msg.text, msg.sender || "", { persist: false });
      });
    }

    viewBtns.forEach((btn) => {
      btn.addEventListener("click", () => showView(btn.dataset.view));
    });

    diaryBtn.addEventListener("click", () => {
      generateDiary(selectedDiaryDate, { manual: true });
    });

    monthPrev.addEventListener("click", () => {
      showDiaryMonth(shiftMonth(diaryMonth || currentMonthKey(), -1));
    });

    monthNext.addEventListener("click", () => {
      if (monthNext.disabled) return;
      showDiaryMonth(shiftMonth(diaryMonth || currentMonthKey(), 1));
    });

    monthToday.addEventListener("click", () => {
      showDiaryMonth(currentMonthKey(), shiftDateKey(0));
    });

    diaryBody.addEventListener("click", () => {
      openDiaryEditor();
    });

    diaryEditorClose.addEventListener("click", () => {
      closeDiaryEditor();
    });

    diaryEditorBackdrop.addEventListener("click", () => {
      closeDiaryEditor();
    });

    diaryEditorInput.addEventListener("blur", () => {
      closeDiaryEditor();
    });

    // 初始化頁面
    function init() {
      modelLabel.textContent = GEMINI_MODEL;
      avatarImg.src = MODES[currentMode].avatar;
      selectedDiaryDate = shiftDateKey(0);
      diaryMonth = currentMonthKey();
      applyModeCharacterUI();
      renderTodayChat();
      showView("chat");
      setPhase("idle");
      sfxMuted = localStorage.getItem(SFX_MUTE_KEY) === "1";
      paintMuteButton();

      scheduleDiaryTick();
      maybeCatchUpDiary();
    }

    // ============================================================================
    // 模式切換與頭像動畫邏輯
    // ============================================================================
    modeBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        const selected = btn.dataset.mode;
        if (selected === currentMode || phase !== "idle") return;

        currentMode = selected;
        modeBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        document.body.classList.toggle("expert-theme", currentMode === "expert");

        avatarImg.classList.add("switching");
        setTimeout(() => {
          avatarImg.src = MODES[currentMode].avatar;
          applyModeCharacterUI();
          avatarImg.classList.remove("switching");
        }, 220);
      });
    });

    // ============================================================================
    // 錄音按鈕：按一下開始錄音，再按一下結束並發送給 Gemini 3.8
    // ============================================================================
    recordBtn.addEventListener("click", async () => {
      if (phase === "listening") {
        stopRecording();
        return;
      }
      if (phase !== "idle") return;
      unlockAudio();
      playWake();
      await startRecording();
    });

    muteBtn.addEventListener("click", () => {
      unlockAudio();
      if (!sfxMuted) playTap();
      setSfxMuted(!sfxMuted);
      if (!sfxMuted) playTap();
    });

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      if (button.id === "muteBtn") return;
      if (button.id === "recordBtn" && phase === "idle") return;
      if (button.closest("#replyStage")) return;
      unlockAudio();
      playTap();
    }, true);

    function getSupportedMimeType() {
      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      for (const type of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    async function startRecording() {
      if (phase !== "idle" || micRequesting) return;
      micRequesting = true;
      recordBtn.disabled = true;
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = getSupportedMimeType();
        mediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((track) => track.stop());

          const finalMime = (mediaRecorder.mimeType || "audio/webm").split(";")[0];
          const audioBlob = new Blob(audioChunks, { type: finalMime });

          if (audioBlob.size < 500) {
            setPhase("idle", "錄音時間太短啦，請再試一次～");
            return;
          }

          if (!setPhase("thinking")) return;
          const priorMessages = getDayMessages(formatDateKey(new Date()));
          const userBubble = appendMessage("user", "正在把你的話轉成文字…", "", { persist: false });
          await sendAudioToGemini(audioBlob, finalMime, priorMessages, userBubble);
        };

        mediaRecorder.start();
        setPhase("listening");
      } catch (err) {
        if (stream) stream.getTracks().forEach((track) => track.stop());
        console.error("麥克風調用失敗：", err);
        setPhase("idle");
        alert("無法存取麥克風！請在瀏覽器彈窗點擊「允許」麥克風權限（建議使用 Chrome 或 Edge 開啟）。");
      } finally {
        micRequesting = false;
      }
    }

    function stopRecording() {
      if (phase !== "listening") return;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    // ============================================================================
    // 將音訊轉為 Base64 並直傳 Gemini 3.8 Flash API
    // ============================================================================
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64String = reader.result.split(",")[1];
          resolve(base64String);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function foldConversation(messages) {
      const contents = [];
      messages.forEach((msg) => {
        const role = msg.role === "model" ? "model" : "user";
        const text = msg.sender ? `（${msg.sender}）${msg.text}` : msg.text;
        const last = contents[contents.length - 1];
        if (last && last.role === role) {
          last.parts[0].text += `\n${text}`;
        } else {
          contents.push({ role, parts: [{ text }] });
        }
      });
      return contents;
    }

    function parseVoicePayload(raw) {
      let text = String(raw || "").trim();
      const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (fenced) text = fenced[1].trim();
      const data = JSON.parse(text);
      return {
        transcript: String(data.transcript || "").trim(),
        reply: String(data.reply || "").trim()
      };
    }

    async function sendAudioToGemini(audioBlob, mimeType, priorMessages, userBubble) {
      const activeConfig = MODES[currentMode];

      try {
        const base64Audio = await blobToBase64(audioBlob);
        const endpoint = requireProxyUrl();
        const contents = foldConversation(priorMessages);
        const currentParts = [
          {
            inlineData: {
              mimeType: mimeType,
              data: base64Audio
            }
          },
          {
            text:
              currentMode === "girl"
                ? "請聽這段語音。transcript 寫成我原本說的話，不要改寫。reply 用可愛女生的語氣直接回覆，絕對不要超過20個字。"
                : "請聽這段語音。transcript 寫成我原本說的話，不要改寫。reply 以專家身分詳細、嚴謹地回覆，控制在1000個字以內。"
          }
        ];
        const last = contents[contents.length - 1];
        if (last && last.role === "user") {
          last.parts.push(...currentParts);
        } else {
          contents.push({ role: "user", parts: currentParts });
        }

        const memory = diaryMemoryText();
        if (memory) {
          const first = contents[0];
          if (first && first.role === "user") {
            first.parts.unshift({ text: memory });
          } else {
            contents.unshift({ role: "user", parts: [{ text: memory }] });
          }
        }

        const requestBody = {
          model: GEMINI_MODEL,
          systemInstruction: {
            parts: [{
              text: `${activeConfig.systemPrompt}\n回覆必須是 JSON 物件，不要加 markdown。transcript 是使用者語音的逐字稿，保留原本用詞。reply 才是你的回答，並遵守上面的字數與語氣限制。`
            }]
          },
          contents,
          generationConfig: {
            temperature: currentMode === "girl" ? 0.85 : 0.4,
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                transcript: { type: "STRING" },
                reply: { type: "STRING" }
              },
              required: ["transcript", "reply"]
            }
          }
        };

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error?.message || `HTTP Error ${response.status}`);
        }

        const rawText =
          data?.candidates?.[0]?.content?.parts
            ?.map((p) => p.text || "")
            .join("")
            .trim() || "";
        let parsed;
        try {
          parsed = parseVoicePayload(rawText);
        } catch (parseError) {
          parsed = { transcript: "", reply: rawText };
        }
        let replyText = parsed.reply || "（未收到文字回覆）";

        if (currentMode === "girl" && [...replyText].length > 20) {
          replyText = [...replyText].slice(0, 19).join("") + "～";
        } else if (currentMode === "expert" && [...replyText].length > 1000) {
          replyText = [...replyText].slice(0, 997).join("") + "...";
        }

        const spoken = parsed.transcript || "（沒有聽清楚這段話）";
        const textEl = userBubble.querySelector(".msg-text");
        if (textEl) textEl.textContent = spoken;
        if (parsed.transcript) {
          const now = new Date();
          saveChatMessage({
            role: "user",
            text: parsed.transcript,
            sender: "",
            mode: currentMode,
            time: formatClock(now),
            date: formatDateKey(now)
          });
        }

        appendMessage("ai", replyText, activeConfig.name, { persist: true });
        stageLine = replyText;
        setPhase("speaking");
      } catch (error) {
        console.error("Gemini API 調用錯誤：", error);
        if (userBubble) userBubble.remove();
        appendMessage("ai", `⚠️ 終端連線異常：${error.message}`, "系統警告", { persist: false });
        setPhase("idle", "請求失敗 · 請檢查網路連線");
      }
    }

    // ============================================================================
    // 畫面輔助函式
    // ============================================================================
    function appendMessage(type, text, senderName = "", options = {}) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message stored ${type === "user" ? "user-message" : "ai-message"}`;
      if (options.persist) {
        const now = new Date();
        saveChatMessage({
          role: type === "user" ? "user" : "model",
          text,
          sender: senderName,
          mode: currentMode,
          time: formatClock(now),
          date: formatDateKey(now)
        });
      }

      if (type === "ai") {
        const senderDiv = document.createElement("div");
        senderDiv.className = "msg-sender";
        senderDiv.textContent = `✦ ${senderName}`;
        msgDiv.appendChild(senderDiv);
      }

      const textDiv = document.createElement("div");
      textDiv.className = "msg-text";
      textDiv.textContent = text;
      msgDiv.appendChild(textDiv);

      chatViewport.appendChild(msgDiv);
      chatViewport.scrollTop = chatViewport.scrollHeight;
      return msgDiv;
    }

    function paintMuteButton() {
      muteBtn.setAttribute("aria-pressed", sfxMuted ? "true" : "false");
      muteBtn.setAttribute("aria-label", sfxMuted ? "開啟音效" : "關閉音效");
      muteBtn.textContent = sfxMuted ? "音效關" : "音效開";
    }

    function unlockAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        const soften = audioCtx.createBiquadFilter();
        soften.type = "lowpass";
        soften.frequency.value = 2800;
        soften.Q.value = 0.5;
        masterGain = audioCtx.createGain();
        masterGain.gain.value = sfxMuted ? 0 : 0.2;
        masterGain.connect(soften);
        soften.connect(audioCtx.destination);
      }
      if (audioCtx.state !== "running") audioCtx.resume();
    }

    function tone(start, freq, dur, gain, slideTo, type) {
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, start);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.exponentialRampToValueAtTime(gain, start + 0.018);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(amp);
      amp.connect(masterGain);
      osc.start(start);
      osc.stop(start + dur + 0.03);
    }

    function playCue(notes) {
      if (!audioCtx || sfxMuted) return;
      try {
        const now = audioCtx.currentTime;
        notes.forEach((note) => {
          tone(now + note.at, note.freq, note.dur, note.gain, note.to, note.type);
        });
      } catch (err) {
        console.error("音效播放失敗：", err);
      }
    }

    function playTap() {
      playCue([
        { at: 0, freq: 1046, to: 1568, dur: 0.06, gain: 0.028 }
      ]);
    }

    function playWake() {
      playCue([
        { at: 0, freq: 523, to: 880, dur: 0.16, gain: 0.05 },
        { at: 0.045, freq: 1318, to: 1760, dur: 0.11, gain: 0.025 }
      ]);
    }

    function playBloom() {
      playCue([
        { at: 0, freq: 392, to: 659, dur: 0.2, gain: 0.045 },
        { at: 0.07, freq: 659, to: 1046, dur: 0.22, gain: 0.03 }
      ]);
    }

    function playFold() {
      playCue([
        { at: 0, freq: 784, to: 349, dur: 0.24, gain: 0.04 }
      ]);
    }

    function stopBed() {
      if (bedTimer) {
        clearInterval(bedTimer);
        bedTimer = null;
      }
    }

    function startBed(kind) {
      stopBed();
      if (!audioCtx || sfxMuted) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const pulse = () => {
        if (!audioCtx || sfxMuted || phase !== kind) return;
        const now = audioCtx.currentTime;
        if (kind === "listening") tone(now, 784, 0.09, 0.016, 988, "sine");
        else tone(now, 330, 0.18, 0.014, 392, "triangle");
      };
      pulse();
      bedTimer = setInterval(pulse, kind === "listening" ? 950 : 1450);
    }

    function syncSfx(prev, next) {
      if (prev === next) return;
      stopBed();
      if (!audioCtx || sfxMuted) return;
      if (next === "listening") startBed("listening");
      else if (next === "thinking") startBed("thinking");
      else if (next === "speaking") playBloom();
      else if (prev === "speaking" && next === "idle") playFold();
    }

    function setSfxMuted(muted) {
      sfxMuted = muted;
      localStorage.setItem(SFX_MUTE_KEY, muted ? "1" : "0");
      paintMuteButton();
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime(muted ? 0 : 0.2, audioCtx.currentTime, 0.02);
      }
      if (muted) stopBed();
      else if (phase === "listening" || phase === "thinking") startBed(phase);
    }

    function setPhase(next, message) {
      if (next !== phase && !(PHASE_NEXT[phase] || []).includes(next)) return false;
      const prev = phase;
      phase = next;
      document.body.dataset.phase = phase;
      syncSfx(prev, next);

      const cfg = MODES[currentMode];
      const statusCopy = {
        idle: cfg.statusTagline,
        listening: "聲痕收音中 · 請開始說話...",
        thinking: `${cfg.name} 正在解析語音共鳴...`,
        speaking: `${cfg.name} 正在回應...`
      };
      const hintCopy = {
        idle: "點擊開始錄音",
        listening: "正在傾聽... 再按一下結束並發送",
        thinking: "解析中，請稍候",
        speaking: "點一下舞台即可收合"
      };
      statusDot.className = "status-dot";
      if (phase !== "idle") statusDot.classList.add(phase);
      statusText.textContent = message || statusCopy[phase];
      recordHint.textContent = hintCopy[phase];
      recordBtn.classList.toggle("recording", phase === "listening");
      recordBtn.disabled = phase === "thinking" || phase === "speaking";
      micIcon.classList.toggle("hidden", phase === "listening");
      stopIcon.classList.toggle("hidden", phase !== "listening");
      syncStage();
      return true;
    }

    function syncStage() {
      const show = phase === "speaking";
      document.body.classList.toggle("stage-on", show);
      replyStage.setAttribute("aria-hidden", show ? "false" : "true");
      if (!show) return;
      stageImg.src = avatarImg.src;
      stageImg.alt = MODES[currentMode].name;
      stageName.textContent = MODES[currentMode].name;
      stageReply.textContent = stageLine;
    }

    function endSpeaking() {
      if (phase !== "speaking") return;
      setPhase("idle", "共鳴完成 · 點擊下方按鈕繼續對話");
    }

    replyStage.addEventListener("click", endSpeaking);
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (diaryEditor.getAttribute("aria-hidden") === "false") {
        closeDiaryEditor();
        return;
      }
      endSpeaking();
    });

    async function requestGeminiText(systemPrompt, userText) {
      const endpoint = requireProxyUrl();
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: GEMINI_MODEL,
          systemInstruction: { parts: [{ text: systemPrompt }] },
          contents: [{ role: "user", parts: [{ text: userText }] }],
          generationConfig: { temperature: 0.5 }
        })
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data?.error?.message || `HTTP Error ${response.status}`);
      }
      return data?.candidates?.[0]?.content?.parts?.map((part) => part.text || "").join("").trim() || "（未收到文字回覆）";
    }

    function conversationTranscript(dateKey) {
      return getDayMessages(dateKey)
        .map((msg) => {
          const who = msg.role === "user" ? "使用者" : (msg.sender || "AI");
          return `${msg.time || ""} ${who}：${msg.text}`;
        })
        .join("\n");
    }

    async function generateDiary(dateKey, { manual = false } = {}) {
      if (diaryGenerating) return;
      const messages = getDayMessages(dateKey);
      if (messages.length === 0) {
        const notice = "這一天還沒有對話，無法整理日記。";
        if (manual) diaryStatus.textContent = notice;
        return;
      }

      diaryGenerating = true;
      diaryBtn.disabled = true;
      diaryStatus.textContent = "正在整理日記…";
      try {
        const text = await requestGeminiText(
          DIARY_PROMPT,
          `日期：${dateKey}\n\n${conversationTranscript(dateKey)}`
        );
        const diaries = getDiaries();
        diaries[dateKey] = { text, createdAt: new Date().toISOString() };
        writeJson(DIARY_STORAGE_KEY, diaries);
        diaryStatus.textContent = "日記已儲存";
        if (currentView === "diary") renderDiary();
      } catch (error) {
        diaryStatus.textContent = `整理失敗：${error.message}`;
      } finally {
        diaryGenerating = false;
        diaryBtn.disabled = false;
        if (currentView === "diary") renderDiary();
      }
    }

    function msUntilNextDiaryTime() {
      const now = new Date();
      const target = new Date(now);
      target.setHours(23, 59, 0, 0);
      if (now >= target) target.setDate(target.getDate() + 1);
      return target.getTime() - now.getTime();
    }

    function scheduleDiaryTick() {
      setTimeout(() => {
        generateDiary(formatDateKey(new Date())).finally(scheduleDiaryTick);
      }, msUntilNextDiaryTime());
    }

    function maybeCatchUpDiary() {
      const now = new Date();
      const passed = now.getHours() > 23 || (now.getHours() === 23 && now.getMinutes() >= 59);
      if (!passed) return;
      const today = formatDateKey(now);
      const hasChat = getDayMessages(today).length > 0;
      const hasDiary = Boolean(getDiaries()[today]?.text);
      if (hasChat && !hasDiary) generateDiary(today);
    }

    init();
  </script>
</body>
